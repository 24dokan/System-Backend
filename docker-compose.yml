services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: system_backend
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # Object storage (for product media) is intentionally not started here yet.
  # MinIO no longer publishes free public images, so a replacement S3-compatible
  # store will be chosen later. Everything except media uploads works without it.
volumes:
  pgdata:
